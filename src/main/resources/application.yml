spring:
  application:
    name: WayGo-Backend

  datasource:
    url: jdbc:postgresql://localhost:5432/waygo
    username: postgres
    password: "1234"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

server:
  port: 8080

logging:
  level:
    root: INFO
    org.example.waygo: DEBUG
    org.hibernate.SQL: DEBUG
